name: Publish dated snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datadump-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalized evidence
        run: python tools/normalize/validate-datasets.py
      - name: Choose date version and compare previous snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,subprocess
          from zoneinfo import ZoneInfo
          today=datetime.datetime.now(ZoneInfo('Asia/Jerusalem')).date().isoformat()
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases?per_page=100']))
          tags={r['tag_name'] for r in releases}
          revision=1
          while today+('' if revision==1 else '.'+str(revision)) in tags:revision+=1
          tag=today+('' if revision==1 else '.'+str(revision))
          previous=[r for r in releases if not r['draft'] and not r['prerelease']]
          args=['python','tools/releases/build-snapshot.py','--date',today,'--revision',str(revision),'--out',f'local/releases/{tag}']
          if previous:
              os.makedirs('local/previous',exist_ok=True)
              subprocess.run(['gh','release','download',previous[0]['tag_name'],'--pattern','BLUSTONE-Stats.json','--dir','local/previous'],check=True)
              args+=['--previous-json','local/previous/BLUSTONE-Stats.json']
          subprocess.run(args,check=True)
          with open('VERSION','w') as f:f.write(tag+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'RELEASE_TAG={tag}\n')
          PY
      - name: Record the dated version
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- VERSION; then
            git add -- VERSION
            git commit -m "Record DataDump snapshot $RELEASE_TAG"
            git push origin HEAD:main
          fi
      - name: Publish regular Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" local/releases/"$RELEASE_TAG"/BLUSTONE-Stats.md local/releases/"$RELEASE_TAG"/BLUSTONE-Evidence.md local/releases/"$RELEASE_TAG"/BLUSTONE-Stats.json local/releases/"$RELEASE_TAG"/RELEASE-MANIFEST.json local/releases/"$RELEASE_TAG"/SHA256SUMS.txt --title "Blustone DataDump $RELEASE_TAG" --notes-file local/releases/"$RELEASE_TAG"/RELEASE-NOTES.md --target "$(git rev-parse HEAD)" --draft=false --prerelease=false --latest
